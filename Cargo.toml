[package]
name = "live-harness"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
description = "Deterministic, source-bound observations of AI organizations"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.dev.package.sha2]
opt-level = 3
[profile.test.package.sha2]
opt-level = 3

